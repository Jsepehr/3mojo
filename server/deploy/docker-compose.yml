# Raen: server + reverse proxy TLS (Caddy).   Dalla cartella server/deploy/:
#
#   cp .env.example .env      # compilare (vedi i commenti nel file)
#   docker compose up -d --build
#
# Rete: il servizio `raen` sta SOLO su una rete interna del compose e non
# pubblica nessuna porta sull'host; l'unico punto d'ingresso è Caddy (80/443),
# che termina TLS e inoltra a raen:8080. `raen` deve poter uscire verso
# Internet (Apple, Google), quindi la rete è un bridge normale, non
# `internal: true` (che bloccherebbe anche l'uscita).

name: raen

services:
  raen:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: raen-server:latest
    restart: unless-stopped
    # Il server ha 5 s per spegnersi in ordine (GracefulShutdown): 10 s di
    # margine prima del SIGKILL.
    stop_grace_period: 10s
    stop_signal: SIGTERM
    init: true
    env_file: .env
    environment:
      # Valori che non si discutono in questo deploy (sovrascrivono .env).
      PORT: "8080"
      RAEN_ENV: production
      DATA_DIR: /var/lib/raen/data
      MODERATION_DIR: /var/lib/raen/moderation
      # Caddy è l'unico proxy fidato: il suo indirizzo è fisso (rete sotto).
      TRUSTED_PROXY: 172.28.0.2
    expose:
      - "8080"
    networks:
      raen_net:
        ipv4_address: 172.28.0.3
    volumes:
      # Stato persistente: sblocchi e transazioni (hash, cifrati) e record di
      # moderazione (cifrati, 30 giorni). Solo questi due.
      - raen_data:/var/lib/raen/data
      - raen_moderation:/var/lib/raen/moderation
      # Credenziali (service account Google, chiave .p8 Apple): in SOLA
      # LETTURA, fuori dall'immagine e dal repository. I percorsi nel .env
      # sono /run/secrets/<file>.
      - ./secrets:/run/secrets:ro
    # Limite di memoria: tarare con MAX_WS_CONNECTIONS (ogni sessione porta
    # un selfie fino a ~230 KB in RAM; 2000 sessioni = ~0,5-1 GB).
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "2.0"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      raen:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      RAEN_DOMAIN: ${RAEN_DOMAIN:?imposta RAEN_DOMAIN nel .env}
      ACME_EMAIL: ${ACME_EMAIL:?imposta ACME_EMAIL nel .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      raen_net:
        ipv4_address: 172.28.0.2
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  raen_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  raen_data:
  raen_moderation:
  caddy_data:
  caddy_config:
